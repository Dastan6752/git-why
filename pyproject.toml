[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-why-trace"
version = "0.1.1"
description = "Answer 'why is this line here?' — reconstruct a line's decision history from git, including what git blame cannot see."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "git-why contributors" }]
keywords = ["git", "blame", "history", "archaeology", "code-review", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.13",  # RUF059 (used in per-file-ignores) is stable since 0.13
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/Dastan6752/git-why"
Documentation = "https://github.com/Dastan6752/git-why#readme"
Changelog = "https://github.com/Dastan6752/git-why/blob/main/CHANGELOG.md"
Issues = "https://github.com/Dastan6752/git-why/issues"

[project.scripts]
# This makes a `git-why` command. Git turns any `git-<name>` executable on
# your PATH into a `git <name>` subcommand, so `git why` works too.
git-why = "git_why.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["git_why*"]

[tool.setuptools.package-data]
git_why = ["py.typed"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["git_why", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit (security)
    "N",             # naming
    "SIM",           # simplify
    "RUF",
]
ignore = [
    "S603", "S607",  # subprocess with a fixed argv ("git", ...) is the whole point of this tool
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S108", "E501", "N802", "RUF059"]  # asserts, fake tokens, /tmp, long literals

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
pretty = true
files = ["git_why"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["git_why"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
