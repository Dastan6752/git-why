name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check git_why tests
      - run: ruff format --check git_why tests
      - run: mypy
      - run: mypy tests

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the smoke test below reads this repository's real history
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov --cov-report=xml
      - name: Smoke test the installed command
        run: |
          git-why --version
          git-why --help > /dev/null      # (`git why --help` is intercepted by git itself and looks for a man page)
          git why -h > /dev/null
          # the repository's own history is a real fixture
          git why README.md:1 --format plain
          git why README.md:1 --json | python -c "import json,sys; d=json.load(sys.stdin); assert d['schema_version']==1 and not d['repo']['shallow']"
          # documented exit codes
          if git why README.md:999999 >/dev/null; then
            echo "Expected out-of-range line to fail" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
          if git why no-such-file.py:1 >/dev/null; then
            echo "Expected missing file to fail" >&2
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install from wheel in a clean venv and smoke test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/git-why --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
